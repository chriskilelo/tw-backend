; TradeWatch queue worker — Supervisor configuration.
;
; TDD-ADR-010: Laravel Queue, database driver at launch. CLAUDE.md Section 12
; and app/Jobs/*.php: every queued job in this codebase currently dispatches
; onto the single 'notifications' queue (SendAlertRoutingNotification,
; SendAlertDelegationNotification, SendInquiryReferralNotification,
; SendDirectiveIssuedNotification, SendDirectiveStaleReminder,
; SendReportDeadlineReminder, SendAccountActivationEmail,
; SendPasswordResetEmail). 'critical' and 'default' are listed here for
; forward compatibility per the session task, not because any job uses them
; today — an idle queue name costs nothing, `queue:work` simply never finds
; work on it.
;
; Deploy: copy this file to /etc/supervisor/conf.d/tw-queue.conf on the
; Application Server, then run:
;   sudo mkdir -p /var/log/tradewatch
;   sudo chown www-data:www-data /var/log/tradewatch   ; adjust user as needed
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start tw-queue:*
;
; See docs/deployment-checklist.md Section 7. The Laravel scheduler (the four
; Schedule::command(...) entries in routes/console.php) is a separate cron
; entry, not managed by this Supervisor program.

[program:tw-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/tw-backend/artisan queue:work --queue=critical,notifications,default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/tw-backend
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=3600
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/tradewatch/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
